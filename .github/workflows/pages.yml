name: Deploy to GitHub Pages

on:
  push:
    # このリポジトリの既定ブランチ。main に統合したら claude/... の行は削れる。
    branches:
      - main
      - claude/mission-red-planet-browser-ch0ltj
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Settings を触らなくても Pages を有効化する
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
