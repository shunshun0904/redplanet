<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ミッション・レッドプラネット — ブラウザ版</title>
<meta name="description" content="ボードゲーム「ミッション：レッドプラネット」風の火星植民ゲーム。ブラウザだけで遊べます。">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%23c9522f'/><circle cx='11' cy='12' r='4' fill='%23e8814a'/></svg>">

<!-- ── アクセス解析 ───────────────────────────────────────────────
     PLAYBENCH（https://shunshun0904.github.io/playbench/）と同じ測定ID。
     どのゲームが遊ばれているかを、1つのプロパティでパスごとに見るため。

     ここがこのファイル唯一の外部読み込みで、行き先は
     https://www.googletagmanager.com/gtag/js だけ。ゲーム本体は
     いままで通り何も読み込まない。

     読み込まない条件が3つある。
       1. file:// で開いたとき ── 1枚で配れる作りを壊さないため
       2. ブラウザが追跡拒否を出しているとき（GPC / DNT）
       3. localStorage の pb-analytics が off のとき
          6サイトとも同一オリジンなので、PLAYBENCH の奥付で「止める」を
          押せば、このゲームでも止まる
     ────────────────────────────────────────────────────────── -->
<script>
(function () {
  var ID = 'G-L76Z1LVWX6';
  if (!/^https?:$/.test(location.protocol)) return;

  var say = null;
  try { say = localStorage.getItem('pb-analytics'); } catch (e) {}
  if (say === 'off') return;
  if (say !== 'on') {
    var d = navigator.doNotTrack || window.doNotTrack || navigator.msDoNotTrack;
    if (navigator.globalPrivacyControl || d === '1' || d === 'yes') return;
  }

  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { window.dataLayer.push(arguments); };
  window.gtag('js', new Date());
  window.gtag('config', ID);

  var s = document.createElement('script');
  s.async = true;
  s.src = 'https://www.googletagmanager.com/gtag/js?id=' + ID;
  document.head.appendChild(s);
})();
</script>

</head>
<body>

<canvas id="stars" aria-hidden="true"></canvas>

<div id="app">
  <header id="topbar">
    <div class="brand">
      <span class="brand-mark">🚀</span>
      <span class="brand-text">MISSION: <b>RED PLANET</b></span>
    </div>
    <div id="track" class="track" aria-label="ラウンドトラッカー"></div>
    <div class="tools">
      <button id="btnSpeed" class="tool" title="演出の速さ">⏩ ふつう</button>
      <button id="btnAmbient" class="tool" title="環境音">🎵</button>
      <button id="btnSound" class="tool" title="効果音">🔊</button>
      <button id="btnHelp" class="tool">ルール</button>
      <button id="btnNew" class="tool">新規</button>
    </div>
  </header>

  <div id="main">
    <section id="boardWrap">
      <svg id="board" viewBox="92 22 872 930" preserveAspectRatio="xMidYMid meet" role="img"
           aria-label="火星の地図"></svg>
    </section>

    <div id="promptBar" class="promptbar"></div>

    <div id="panel">
      <section class="block">
        <div class="block-t">あなたの手札 <span class="dim">使用済みはリクルーターで戻る</span></div>
        <div id="hand" class="hand"></div>
      </section>

      <section class="block">
        <div class="block-t">発射台</div>
        <div id="launchpad" class="launchpad"></div>
        <div id="flight" class="flight"></div>
      </section>

      <div id="players"></div>
      <div id="memorial" class="memorial"></div>

      <section class="block logpanel">
        <div class="block-t">航海日誌</div>
        <div id="log"></div>
      </section>
    </div>
  </div>
</div>

<div id="fxLayer" aria-hidden="true"></div>
<div id="modal" class="modal hidden"></div>

<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/fx.js"></script>
<script src="js/engine.js"></script>
<script src="js/ai.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
