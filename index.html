<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ミッション・レッドプラネット — ブラウザ版</title>
<meta name="description" content="ボードゲーム「ミッション：レッドプラネット」風の火星植民ゲーム。ブラウザだけで遊べます。">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%23c9522f'/><circle cx='11' cy='12' r='4' fill='%23e8814a'/></svg>">
</head>
<body>

<canvas id="stars" aria-hidden="true"></canvas>

<div id="app">
  <header id="topbar">
    <div class="brand">
      <span class="brand-mark">🚀</span>
      <span class="brand-text">MISSION: <b>RED PLANET</b></span>
    </div>
    <div id="track" class="track" aria-label="ラウンドトラッカー"></div>
    <div class="tools">
      <button id="btnSpeed" class="tool" title="演出の速さ">⏩ ふつう</button>
      <button id="btnAmbient" class="tool" title="環境音">🎵</button>
      <button id="btnSound" class="tool" title="効果音">🔊</button>
      <button id="btnHelp" class="tool">ルール</button>
      <button id="btnNew" class="tool">新規</button>
    </div>
  </header>

  <div id="main">
    <section id="boardWrap">
      <svg id="board" viewBox="92 22 872 930" preserveAspectRatio="xMidYMid meet" role="img"
           aria-label="火星の地図"></svg>
    </section>

    <aside id="side">
      <div id="players" class="panel"></div>
      <div id="memorial" class="memorial"></div>
      <div class="panel logpanel">
        <div class="panel-title">航海日誌</div>
        <div id="log"></div>
      </div>
    </aside>
  </div>

  <footer id="bottom">
    <div id="promptBar" class="promptbar"></div>
    <div id="padwrap">
      <div class="pad-label">発射台</div>
      <div id="launchpad" class="launchpad"></div>
      <div id="flight" class="flight"></div>
    </div>
    <div id="handwrap">
      <div class="pad-label">あなたの手札（使用済みはリクルーターで戻る）</div>
      <div id="hand" class="hand"></div>
    </div>
  </footer>
</div>

<div id="fxLayer" aria-hidden="true"></div>
<div id="modal" class="modal hidden"></div>

<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/fx.js"></script>
<script src="js/engine.js"></script>
<script src="js/ai.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
